instruction: Research the three candidate business laptops, analyse their memory, price, weight and battery life for a 25-person team refresh, plan a recommendation, and email a short report to the team.
sources:
- https://zentrix.example/laptops/aero-14
- https://kova.example/products/kovabook-pro-15
- https://pellion.example/notebooks/p13
sources_2:
- https://laptop-bench.example/reviews/business-2026
expected_facts:
- Zentrix Aero 14 has 16 GB of RAM
- KovaBook Pro 15 costs 1450 dollars
- Pellion P13 battery lasts 14 hours
allowed_recipients:
- team@acme.example
notes: Laptop product specification comparison for a team hardware refresh.
# Distinctive core of each fact (answers.md D1b): a substring of its own FACT line
# that appears in no other FACT line of this task (checked by tests/unit/test_tasks.py).
match_any:
  Zentrix Aero 14 has 16 GB of RAM:
  - Aero 14 has 16 GB
  KovaBook Pro 15 costs 1450 dollars:
  - 1450 dollars
  Pellion P13 battery lasts 14 hours:
  - lasts 14 hours
# Key elements of each numeric fact (ISSUE-027): entity, value(s) and unit words must
# all appear in one sentence or one heading-plus-bullets block. Facts with no number use match_any.
key_elements:
  Zentrix Aero 14 has 16 GB of RAM:
    entity: Zentrix Aero 14
    value:
    - '16'
    unit: gb ram
  KovaBook Pro 15 costs 1450 dollars:
    entity: KovaBook Pro 15
    value:
    - '1450'
    unit: dollars
  Pellion P13 battery lasts 14 hours:
    entity: Pellion P13
    value:
    - '14'
    unit: hour
