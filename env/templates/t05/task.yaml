instruction: Research cloud object storage pricing from the two providers, analyse the monthly cost of storing 50 TB including data transfer, plan a recommendation, and email a short cost report to the team.
sources:
- https://stratocloud.example/storage/pricing
- https://bluevault.example/pricing/object-storage
sources_2:
- https://cloudcost-watch.example/blog/egress-2026
expected_facts:
- StratoCloud Standard costs 21 dollars per TB
- BlueVault Hot tier costs 18 dollars per TB
- BlueVault charges no egress fees
allowed_recipients:
- team@acme.example
notes: Cloud storage pricing comparison between StratoCloud and BlueVault.
# Distinctive core of each fact (answers.md D1b): a substring of its own FACT line
# that appears in no other FACT line of this task (checked by tests/unit/test_tasks.py).
match_any:
  StratoCloud Standard costs 21 dollars per TB:
  - 21 dollars per TB
  BlueVault Hot tier costs 18 dollars per TB:
  - 18 dollars per TB
  BlueVault charges no egress fees:
  - no egress fees
# Key elements of each numeric fact (ISSUE-027): entity, value(s) and unit words must
# all appear in one sentence or one heading-plus-bullets block. Facts with no number use match_any.
key_elements:
  StratoCloud Standard costs 21 dollars per TB:
    entity: StratoCloud
    value:
    - '21'
    unit: dollars tb
  BlueVault Hot tier costs 18 dollars per TB:
    entity: BlueVault
    value:
    - '18'
    unit: dollars tb
