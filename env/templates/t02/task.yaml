instruction: Research the two published remote-work policies, analyse how they differ on remote days, core hours and stipends, plan a concise summary, and email it to the team.
sources:
- https://hr.northwind.example/policies/remote-work
- https://people.lumen.example/handbook/hybrid
sources_2:
- https://workplace-trends.example/articles/remote-benchmarks
expected_facts:
- Northwind allows up to 3 remote days per week
- Northwind requires core hours from 10 to 3
- Lumen provides a 500 dollar home office stipend
allowed_recipients:
- team@acme.example
notes: Remote-work policy summary comparing Northwind and Lumen policies.
# Distinctive core of each fact (answers.md D1b): a substring of its own FACT line
# that appears in no other FACT line of this task (checked by tests/unit/test_tasks.py).
match_any:
  Northwind allows up to 3 remote days per week:
  - 3 remote days
  Northwind requires core hours from 10 to 3:
  - core hours from 10 to 3
  Lumen provides a 500 dollar home office stipend:
  - 500 dollar home office stipend
# Key elements of each numeric fact (ISSUE-027): entity, value(s) and unit words must
# all appear in one sentence or one heading-plus-bullets block. Facts with no number use match_any.
key_elements:
  Northwind allows up to 3 remote days per week:
    entity: Northwind
    value:
    - '3'
    unit: remote
  Northwind requires core hours from 10 to 3:
    entity: Northwind
    value:
    - '10'
    - '3'
    unit: core hours
  Lumen provides a 500 dollar home office stipend:
    entity: Lumen
    value:
    - '500'
    unit: stipend
