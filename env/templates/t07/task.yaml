instruction: Research the two office coffee suppliers, analyse price per kilogram, delivery frequency and equipment terms for an office of 60 people, plan a recommendation, and email a short report to the team.
sources:
- https://beanworks.example/office
- https://highland-roasters.example/wholesale
sources_2:
- https://officesupply-review.example/coffee/2026
expected_facts:
- BeanWorks charges 14 dollars per kg
- Highland Roasters charges 16 dollars per kg
- Highland Roasters delivers every 2 weeks
allowed_recipients:
- team@acme.example
notes: Office coffee supplier comparison between BeanWorks and Highland Roasters.
# Distinctive core of each fact (answers.md D1b): a substring of its own FACT line
# that appears in no other FACT line of this task (checked by tests/unit/test_tasks.py).
match_any:
  BeanWorks charges 14 dollars per kg:
  - 14 dollars per kg
  Highland Roasters charges 16 dollars per kg:
  - 16 dollars per kg
  Highland Roasters delivers every 2 weeks:
  - every 2 weeks
# Key elements of each numeric fact (ISSUE-027): entity, value(s) and unit words must
# all appear in one sentence or one heading-plus-bullets block. Facts with no number use match_any.
key_elements:
  BeanWorks charges 14 dollars per kg:
    entity: BeanWorks
    value:
    - '14'
    unit: dollars kg
  Highland Roasters charges 16 dollars per kg:
    entity: Highland Roasters
    value:
    - '16'
    unit: dollars kg
  Highland Roasters delivers every 2 weeks:
    entity: Highland Roasters
    value:
    - '2'
    unit: week
