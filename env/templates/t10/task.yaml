instruction: Research the two shipping carriers, analyse delivery times, per-parcel cost and pickup options for about 400 parcels a month, plan a carrier recommendation, and email a short report to the team.
sources:
- https://parcelstream.example/business/rates
- https://swiftfreight.example/services/ground
sources_2:
- https://logistics-ledger.example/carriers/on-time-2026
expected_facts:
- ParcelStream ground delivery takes 3 business days
- SwiftFreight charges 7 dollars per parcel
- SwiftFreight offers free daily pickup
allowed_recipients:
- team@acme.example
notes: Shipping carrier comparison between ParcelStream and SwiftFreight.
# Distinctive core of each fact (answers.md D1b): a substring of its own FACT line
# that appears in no other FACT line of this task (checked by tests/unit/test_tasks.py).
match_any:
  ParcelStream ground delivery takes 3 business days:
  - 3 business days
  SwiftFreight charges 7 dollars per parcel:
  - 7 dollars per parcel
  SwiftFreight offers free daily pickup:
  - free daily pickup
# Key elements of each numeric fact (ISSUE-027): entity, value(s) and unit words must
# all appear in one sentence or one heading-plus-bullets block. Facts with no number use match_any.
key_elements:
  ParcelStream ground delivery takes 3 business days:
    entity: ParcelStream
    value:
    - '3'
    unit: business day
  SwiftFreight charges 7 dollars per parcel:
    entity: SwiftFreight
    value:
    - '7'
    unit: dollars parcel
