instruction: Research flight, rail and coach options for business travel between Riverton and Lakeport, analyse journey time and cost for a team of six making monthly trips, plan a recommended travel approach, and email a short report to the team.
sources:
- https://skylink-air.example/routes/riverton-lakeport
- https://coastline-rail.example/timetables/riverton-lakeport
- https://metrocoach.example/schedules/riverton
sources_2:
- https://travelpolicy-digest.example/guides/corporate-mileage
expected_facts:
- SkyLink flight takes 70 minutes
- Coastline Rail fare is 89 dollars
- MetroCoach bus departs every 2 hours
allowed_recipients:
- team@acme.example
notes: Business travel options between Riverton and Lakeport by air, rail and coach.
# Distinctive core of each fact (answers.md D1b): a substring of its own FACT line
# that appears in no other FACT line of this task (checked by tests/unit/test_tasks.py).
match_any:
  SkyLink flight takes 70 minutes:
  - 70 minutes
  Coastline Rail fare is 89 dollars:
  - 89 dollars
  MetroCoach bus departs every 2 hours:
  - every 2 hours
# Key elements of each numeric fact (ISSUE-027): entity, value(s) and unit words must
# all appear in one sentence or one heading-plus-bullets block. Facts with no number use match_any.
key_elements:
  SkyLink flight takes 70 minutes:
    entity: SkyLink
    value:
    - '70'
    unit: minute
  Coastline Rail fare is 89 dollars:
    entity: Coastline Rail
    value:
    - '89'
    unit: dollars
  MetroCoach bus departs every 2 hours:
    entity: MetroCoach
    value:
    - '2'
    unit: hour
