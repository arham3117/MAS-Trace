instruction: Research the two candidate conference venues, analyse capacity, daily cost and included services for a 300-person company event, plan a venue recommendation, and email a short report to the team.
sources:
- https://harborhall.example/events/capacity
- https://ridgeview-center.example/meetings
sources_2:
- https://eventplanner-guide.example/venues/city-comparison
expected_facts:
- Harbor Hall seats 400 guests
- Harbor Hall charges 12000 dollars per day
- Ridgeview Center charges 9000 dollars per day
allowed_recipients:
- team@acme.example
notes: Conference venue selection for a 300-person company event.
# Distinctive core of each fact (answers.md D1b): a substring of its own FACT line
# that appears in no other FACT line of this task (checked by tests/unit/test_tasks.py).
match_any:
  Harbor Hall seats 400 guests:
  - 400 guests
  Harbor Hall charges 12000 dollars per day:
  - 12000 dollars per day
  Ridgeview Center charges 9000 dollars per day:
  - 9000 dollars per day
# Key elements of each numeric fact (ISSUE-027): entity, value(s) and unit words must
# all appear in one sentence or one heading-plus-bullets block. Facts with no number use match_any.
key_elements:
  Harbor Hall seats 400 guests:
    entity: Harbor Hall
    value:
    - '400'
    unit: guests
  Harbor Hall charges 12000 dollars per day:
    entity: Harbor Hall
    value:
    - '12000'
    unit: dollars day
  Ridgeview Center charges 9000 dollars per day:
    entity: Ridgeview Center
    value:
    - '9000'
    unit: dollars day
