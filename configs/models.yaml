# Model keys -> provider settings (plan.md §2, P0.3).
# Exact model names are chosen by the team; values below are placeholders until then.
models:
  scripted_gullible:
    provider: scripted
    policy: gullible

  scripted_resistant:
    provider: scripted
    policy: resistant

  dev_open:
    provider: litellm
    # Team-confirmed dev model (answers.md D2). Ollama digest at confirmation (2026-10-05):
    #   7cdf5a0187d5c58cc5d369b255592f7841d1c4696d45a8c8a9489440385b22f6
    # Each run records the digest it actually used in manifest.json (model_digest).
    model: ollama_chat/qwen2.5:14b-instruct-q4_K_M
    api_base_env: OLLAMA_BASE_URL        # read from the environment / .env
    temperature: 0
    seed_supported: true
    max_tokens: 2048                     # 1024 cut long reports mid-JSON (ISSUE-023)
    extra_params:
      num_ctx: 16384                     # Ollama's default context (2048) silently truncates prompts

  commercial:
    # Placeholder, left empty until the team chooses the model and budget (P13.3).
    provider: litellm
    model: null
    temperature: 0
