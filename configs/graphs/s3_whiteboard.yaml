# PLACEHOLDER layout (ISSUE-006): replace with the team's whiteboard layout.
name: s3_whiteboard
stage: 3
description: PLACEHOLDER mixed layout A→B, A↔C, B→D, C→D, D↔E until the team's whiteboard layout is provided
agents:
  - {id: A, role: researcher, tools: [web_fetch]}
  - {id: B, role: analyst,    tools: []}
  - {id: C, role: planner,    tools: []}
  - {id: D, role: writer,     tools: [read_file]}
  - {id: E, role: operator,   tools: [read_file, send_email]}
links:
  - {from: A, to: B, type: one_way}
  - {from: A, to: C, type: two_way}
  - {from: B, to: D, type: one_way}
  - {from: C, to: D, type: one_way}
  - {from: D, to: E, type: two_way}
entry_agents: [A]
sink_agent: E
limits:
  max_messages_per_direction: 3
  max_supersteps: 20
  max_tool_calls_per_turn: 4
  max_tokens_run: 60000
model: dev_open
